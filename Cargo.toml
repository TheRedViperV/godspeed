[package]
name = "godspeed"
version = "0.3.4"
edition = "2021"
description = "Instant file search and disk space analyzer for Windows"
license = "MIT"

# The app lives in the library; Godspeed (here) and LordSpeed (lordspeed/) are thin
# launchers around it, so every change reaches both.
[lib]
name = "godspeed"
path = "src/lib.rs"

[[bin]]
name = "godspeed"
path = "src/main.rs"

[workspace]
members = [".", "lordspeed"]

[dependencies]
# wgpu draws through DirectX, which avoids the flicker the default OpenGL path
# shows on Windows; OpenGL stays as a fallback for machines where it can't start.
eframe = { version = "0.31", features = ["wgpu"] }
lz4_flex = "0.11"
memchr = "2"
notify = "8"
raw-window-handle = "0.6"
rayon = "1.10"
rfd = "0.15"
# Space view: moving files to the Recycle Bin.
trash = "5"
# The size column in Explorer: UI Automation, the shell's window list, a layered window.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
